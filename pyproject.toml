[project]
name = "arjev"
version = "0.6.0"
description = "A daily arXiv digest engine that ranks against your living Obsidian vault."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Harmoniqs" }]
keywords = ["arxiv", "obsidian", "papers", "research", "digest", "slack"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "PyYAML>=6.0",
  "httpx>=0.27",
  "pypdf>=4.0",
]

[project.urls]
Homepage = "https://github.com/harmoniqs/arJev"
Documentation = "https://github.com/harmoniqs/arJev/blob/main/docs/setup.md"
Changelog = "https://github.com/harmoniqs/arJev/blob/main/CHANGELOG.md"
Issues = "https://github.com/harmoniqs/arJev/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
arjev = "arjev.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arjev"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
